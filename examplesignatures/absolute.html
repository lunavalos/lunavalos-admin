<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="480"
    style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; border:0; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; width:480px;">

    <tr>
        <!-- LOGO -->
        <td width="140" valign="middle" style="padding:0; margin:0; border:0;">
            <a href="https://absolute-fi.com/" target="_blank" style="text-decoration:none; border:0; outline:none;">
                <img src="https://absolutegroup.mx/wp-content/uploads/absolute-group.gif" width="120"
                    alt="Absolute Group Inc." style="display:block; border:0; outline:none; text-decoration:none;">
            </a>
        </td>

        <!-- BLOQUE DERECHO -->
        <td valign="top" style="padding:0; margin:0; border:0;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                style="border-collapse:collapse; border:0;">

                <tr>
                    <!-- FOTO (usa PNG ya redondeado) -->
                    <td width="70" valign="middle" style="padding:0; border:0;">
                        <img src="{{photo}}" width="70" height="70" alt="{{name}}"
                            style="display:block; border:0; outline:none; border-radius:50%; width:70px; height:70px; object-fit:cover; margin:0 10px 0 0;">
                    </td>

                    <!-- NOMBRE / PUESTO -->
                    <td valign="middle" style="padding:0; border:0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                            style="border-collapse:collapse; border:0;">
                            <tr>
                                <td
                                    style="padding:0; margin:0; border:0; font-size:14pt; line-height:1.1; font-weight:700; color:#000000; mso-line-height-rule:exactly;">
                                    {{name}}
                                </td>
                            </tr>
                            <tr>
                                <td
                                    style="padding:2px 0 0 0; margin:0; border:0; font-size:10pt; line-height:1.2; font-weight:400; color:#0E4194; mso-line-height-rule:exactly;">
                                    {{position}}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CONTACTO + QR -->
                <tr>
                    <td colspan="2" style="padding-top:8px; border:0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                            style="border-collapse:collapse; border:0;">
                            <tr>

                                <!-- DATOS -->
                                <td valign="top" style="border:0;">
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                                        style="border-collapse:collapse; border:0;">

                                        <!-- TELÉFONO -->
                                        <tr>
                                            <td style="padding:2px 6px 2px 0; border:0;">
                                                <a href="https://wa.me/19563341496" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://absolutegroup.mx/wp-content/uploads/phone.png"
                                                        width="15" alt="Phone"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td
                                                style="padding:2px 0; border:0; font-size:10pt; line-height:1.4; color:#636466; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                          <span style="color:#636466; text-decoration:none;">{{phone}}</span>
                        <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="https://wa.me/19563341496" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none; color:#636466;">
                                                    <span style="color:#636466; text-decoration:none;">{{phone}}</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>


                                        <!-- EMAIL -->
                                        <tr>
                                            <td style="padding:2px 6px 2px 0; border:0;">
                                                <a href="mailto:{{email}}" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://absolutegroup.mx/wp-content/uploads/email.png"
                                                        width="15" alt="Email"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td
                                                style="padding:2px 0; border:0; font-size:10pt; line-height:1.4; color:#636466; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                          <span style="color:#636466; text-decoration:none;">{{email}}</span>
                        <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="mailto:{{email}}" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none; color:#636466;">
                                                    <span style="color:#636466; text-decoration:none;">{{email}}</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>

                                        <!-- WEBSITE -->
                                        <tr>
                                            <td style="padding:2px 6px 2px 0; border:0;">
                                                <a href="https://absolute-fi.com" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://absolutegroup.mx/wp-content/uploads/web.png"
                                                        width="15" alt="Website"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td
                                                style="padding:2px 0; border:0; font-size:10pt; line-height:1.4; color:#636466; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                          <span style="color:#636466; text-decoration:none;">absolute-fi.com</span>
                        <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="https://absolute-fi.com" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none; color:#636466;">
                                                    <span
                                                        style="color:#636466; text-decoration:none;">absolute-fi.com</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>

                                        <!-- SURVEY -->
                                        <tr>
                                            <td style="padding:2px 6px 2px 0; border:0;">
                                                <a href="https://absolute-fi.com/satisfaction-survey/" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://absolutegroup.mx/wp-content/uploads/checklist-1.png"
                                                        width="18" alt="Survey"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td
                                                style="padding:2px 0; border:0; font-size:10pt; line-height:1.4; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                          <span style="color:#0E4194; font-style:italic; text-decoration:none;">Take our survey</span>
                        <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="https://absolute-fi.com/satisfaction-survey/" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none; color:#0E4194;">
                                                    <span
                                                        style="color:#0E4194; font-style:italic; text-decoration:none;">Take
                                                        our survey</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>

                                    </table>
                                </td>

                                <!-- QR -->
                                <td valign="middle" align="right" style="padding-left:14px; border:0;">
                                    <a href="https://absolute-fi.com" target="_blank"
                                        style="text-decoration:none; border:0; outline:none;">
                                        <img src="https://absolutegroup.mx/wp-content/uploads/absolute-QR.png"
                                            width="78" height="78" alt="QR Code"
                                            style="display:block; border:0; outline:none;">
                                    </a>
                                </td>

                            </tr>
                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <!-- LÍNEA INFERIOR -->
    <tr>
        <td colspan="2" style="padding-top:12px; border:0; line-height:0;">
            <img src="https://absolutegroup.mx/wp-content/uploads/lines.png" width="480" alt=""
                style="display:block; border:0; outline:none;">
        </td>
    </tr>

</table>
