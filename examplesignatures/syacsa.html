<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="480"
    style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; border:0; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; width:480px;">

    <tr>
        <!-- LOGO -->
        <td width="150" valign="middle" style="padding:0; margin:0; border:0;">
            <a href="https://syacsa.com/" target="_blank" style="text-decoration:none; border:0; outline:none;">
                <img src="https://syacsa.com/signatures/global-files/animated-logo.gif" width="150" height="114"
                    alt="SYACSA"
                    style="display:block; border:0; outline:none; text-decoration:none; width:150px; height:114px;">
            </a>
        </td>

        <!-- BLOQUE DERECHO -->
        <td valign="top" style="padding:0 0 0 10px; margin:0; border:0;">

            <!-- FOTO + NOMBRE -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; border:0; width:100%;">

                <tr>
                    <td width="60" height="60" valign="middle" style="padding:0; margin:0; border:0;">
                        <img src="{{photo}}" height="60" width="60" alt="{{name}}"
                            style="display:block; border:0; outline:none; text-decoration:none; border-radius:50%; width:60px; height:60px; object-fit:cover;">
                    </td>

                    <td valign="middle" style="padding:0; margin:0; border:0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                            style="border-collapse:collapse; border:0; width:100%;">
                            <tr>
                                <td
                                    style="padding:0 0 0 8px; margin:0; border:0; font-size:14pt; line-height:1.1; font-weight:700; color:#000000; mso-line-height-rule:exactly;">
                                    {{name}}
                                </td>
                            </tr>
                            <tr>
                                <td
                                    style="padding:2px 0 0 8px; margin:0; border:0; font-size:10pt; line-height:1.2; font-weight:400; color:#ed1c24; mso-line-height-rule:exactly;">
                                    {{position}}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- LÍNEA ROJA (en vez de HR) -->
                <tr>
                    <td colspan="2" style="padding:8px 0 6px 0; margin:0; border:0; line-height:0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                            style="border-collapse:collapse; border:0; width:100%;">
                            <tr>
                                <td height="1"
                                    style="padding:0; margin:0; border:0; background-color:#ed1c24; line-height:1px; font-size:1px;">
                                    &nbsp;
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CONTACTO -->
                <tr>
                    <td colspan="2" style="padding:0; margin:0; border:0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                            style="border-collapse:collapse; border:0; width:100%;">
                            <tr>
                                <td valign="top" width="100%" style="padding:0; margin:0; border:0; width:100%;">
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                                        style="border-collapse:collapse; border:0; width:100%;">

                                        <!-- TEL -->
                                        <tr>
                                            <td valign="middle" style="padding:3px 6px 3px 0; margin:0; border:0;">
                                                <a href="https://wa.me/{{phone}}" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://syacsa.com/signatures/global-files/phone.png"
                                                        width="15" alt="Tel"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td valign="middle"
                                                style="padding:3px 0; margin:0; border:0; font-size:10pt; line-height:1.4; color:#636466; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                    <span style="color:#636466; text-decoration:none;">{{phone}}</span>
                  <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="https://wa.me/{{phone}}" target="_blank"
                                                    style="color:#636466; text-decoration:none; border:0; outline:none;">
                                                    <span style="color:#636466; text-decoration:none;">{{phone}}</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>

                                        <!-- EMAIL -->
                                        <tr>
                                            <td valign="middle" style="padding:3px 6px 3px 0; margin:0; border:0;">
                                                <a href="mailto:{{email}}" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://syacsa.com/signatures/global-files/email.png"
                                                        width="15" alt="Email"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td valign="middle"
                                                style="padding:3px 0; margin:0; border:0; font-size:10pt; line-height:1.4; color:#636466; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                    <span style="color:#636466; text-decoration:none;">{{email}}</span>
                  <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="mailto:{{email}}" target="_blank"
                                                    style="color:#636466; text-decoration:none; border:0; outline:none;">
                                                    <span style="color:#636466; text-decoration:none;">{{email}}</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>

                                        <!-- WEB -->
                                        <tr>
                                            <td valign="middle" style="padding:3px 6px 3px 0; margin:0; border:0;">
                                                <a href="https://syacsa.com/" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://syacsa.com/signatures/global-files/link.png"
                                                        width="15" alt="Web"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td valign="middle"
                                                style="padding:3px 0; margin:0; border:0; font-size:10pt; line-height:1.4; color:#636466; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                    <span style="color:#636466; text-decoration:none;">syacsa.com</span>
                  <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="https://syacsa.com/" target="_blank"
                                                    style="color:#636466; text-decoration:none; border:0; outline:none;">
                                                    <span style="color:#636466; text-decoration:none;">syacsa.com</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>

                                        <!-- ENCUESTA -->
                                        <tr>
                                            <td valign="middle" style="padding:3px 6px 0 0; margin:0; border:0;">
                                                <a href="https://syacsa.com/encuesta-de-satisfaccion/" target="_blank"
                                                    style="text-decoration:none; border:0; outline:none;">
                                                    <img src="https://syacsa.com/signatures/global-files/encuesta.png"
                                                        width="18" alt="Encuesta"
                                                        style="display:block; border:0; outline:none;">
                                                </a>
                                            </td>
                                            <td valign="middle"
                                                style="padding:3px 0 0 0; margin:0; border:0; font-size:10pt; line-height:1.4; color:#ed1c24; mso-line-height-rule:exactly;">
                                                <!--[if mso]>
                    <span style="color:#ed1c24; font-style:italic; text-decoration:none;">Responde nuestra encuesta</span>
                  <![endif]-->
                                                <!--[if !mso]><!-- -->
                                                <a href="https://syacsa.com/encuesta-de-satisfaccion/" target="_blank"
                                                    style="color:#ed1c24; text-decoration:none; border:0; outline:none;">
                                                    <span
                                                        style="color:#ed1c24; font-style:italic; text-decoration:none;">Responde
                                                        nuestra encuesta</span>
                                                </a>
                                                <!--<![endif]-->
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>

    <!-- MARCAS -->
    <tr>
        <td colspan="2" style="padding:15px 0 0 0; margin:0; border:0; text-align:center;">
            <a href="https://syacsa.com/marcas/" target="_blank"
                style="text-decoration:none; border:0; outline:none; display:inline-block;">
                <img src="https://syacsa.com/signatures/global-files/marcas.jpg" width="400" alt="Marcas"
                    style="display:block; margin:0 auto; border:0; outline:none; text-decoration:none; width:400px; height:auto;">
            </a>
        </td>
    </tr>

</table>
