<table border="0" cellpadding="0" cellspacing="0" width="100%"
    style="background-color: #ffffff;">
    <tr>
        <td style="padding-right: 20px; vertical-align: middle;">
            <p style="margin:0; text-align: left;"><a style="display: block;" href="https://clemherramientas.com/"
                    target="_blank"><img src="http://clemherramientas.com/signatures/clem-herramientas-logo-v2.gif"
                        width="160" height="auto"
                        style=" display: block; width:140px; max-width:140px; min-width:140px; text-align: center; height:auto;"></a></p>
        </td>
        <td style="border-left: 1px solid #dcdcdc; padding-left: 20px; vertical-align: middle;">
            <table border="0" cellpadding="0" cellspacing="0">
                <tr>
                    <td style="vertical-align: middle; max-width:230px; min-width:230px;">
                        <div style="font-size: 14px; font-weight: bold; color: #4a4a4a;">{{name}}</div>
                        <div style="font-size: 11px; color: #8a8a8a; margin-top: 2px;">{{position}}</div>
                        <div style="font-size: 10px; color: #4a4a4a; margin-top: 6px; line-height: 1.6;">
                            <a href="mailto:{{email}}" style="color:#4a4a4a; text-decoration: none;">{{email}}</a><br>
                            <a href="tel:{{phone}}" style="color:#4a4a4a; text-decoration: none;">{{phone}}</a><br>
                            <a href="https://clemherramientas.com/" target="_blank" style="color:#4a4a4a; text-decoration: none;">clemherramientas.com</a>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
