[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; ── Apache (web server) ──────────────────────────────────────────────────────
[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Laravel Queue Worker ─────────────────────────────────────────────────────
; Processes queued jobs: ticket notifications, email broadcasts, etc.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=20
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/queue-worker-error.log
stderr_logfile_maxbytes=5MB

; ── Laravel Reverb (WebSocket server) ────────────────────────────────────────
; Handles real-time notifications via WebSocket connections
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/html
autostart=true
autorestart=true
priority=30
user=www-data
stdout_logfile=/var/log/supervisor/reverb.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/reverb-error.log
stderr_logfile_maxbytes=5MB

; ── Laravel Scheduler ────────────────────────────────────────────────────────
; Sin esto NADA de routes/console.php corre en producción: los posts sociales
; programados nunca se encolan, las cotizaciones no expiran y el tipo de cambio
; no se actualiza. La imagen no trae cron, así que usamos schedule:work, que es
; un proceso que se queda vivo y dispara los comandos cada minuto.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
priority=25
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/scheduler-error.log
stderr_logfile_maxbytes=5MB
